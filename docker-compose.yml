name: stocks-scanner

services:
  scanner:
    build: .
    container_name: stocks-scanner
    ports:
      # Loopback: el proyecto no tiene ninguna autenticación, así que no debe
      # quedar alcanzable desde internet. La entrada va por cloudflared/traefik.
      - "127.0.0.1:8030:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config/api_keys.json:/app/config/api_keys.json:ro
    environment:
      - TZ=America/New_York
    restart: unless-stopped
